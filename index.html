<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IKFC — Simulador de apostas</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--sumi:#08080a;--panel:#141114;--blood:#c1121f;--blood2:#7d0a12;--bone:#efe6d8;--ash:#8d8479;--gold:#c9a45c;--line:#2c2326;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--sumi);color:var(--bone);font-family:Archivo,system-ui,sans-serif;line-height:1.5}
.mincho{font-family:'Shippori Mincho B1','Hiragino Mincho ProN',serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.view{display:none;min-height:100vh}.view.on{display:block}

/* LOGO */
#logo{position:relative;overflow:hidden;text-align:center;padding:12vh 20px 40px}
#logo .sun{position:absolute;left:50%;top:44%;width:min(120vw,720px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--blood) 0 52%,var(--blood2) 70%,transparent 71%);opacity:.92}
#logo .fist{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:min(60vw,380px);color:var(--sumi);opacity:.32;line-height:1;pointer-events:none}
#logo .inner{position:relative;z-index:2}
.brand{font-weight:800;font-size:clamp(84px,24vw,200px);letter-spacing:.02em;line-height:.9;margin:8vh 0 0;color:var(--bone);text-shadow:6px 6px 0 var(--sumi)}
.tag{font-size:clamp(15px,3.6vw,20px);margin:14px auto 0;max-width:30ch;color:var(--bone)}
.sub{font-size:13px;color:#e9c9c6;margin-top:6px}
.cta{margin-top:34px;background:var(--sumi);color:var(--bone);border:2px solid var(--bone);padding:16px 38px;font-weight:800;font-size:17px;border-radius:2px}
.cta:hover{background:var(--bone);color:var(--sumi)}
.note{position:relative;z-index:2;margin:44px auto 0;max-width:46ch;font-size:12px;color:var(--ash)}

/* APP */
header.top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
header.top .mark{font-weight:800;font-size:26px;color:var(--blood);background:none;border:0;padding:0}
header.top nav{display:flex;gap:4px;margin-left:auto}
header.top nav button{background:none;border:0;padding:8px 12px;color:var(--ash);font-weight:600;border-bottom:2px solid transparent}
header.top nav button.act{color:var(--bone);border-color:var(--blood)}
.wal{background:var(--panel);border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:2px;font-weight:800;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:22px 18px 60px}
h2{font-size:28px;margin:0 0 4px}
.lead{color:var(--ash);margin:0 0 20px;max-width:60ch}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);text-align:left;padding:0;overflow:hidden;border-radius:2px;display:block;width:100%}
.card.sel{border-color:var(--blood);box-shadow:0 0 0 2px var(--blood)}
.card .ph{height:270px;background:linear-gradient(160deg,var(--blood2),var(--sumi));display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.card .ph span{font-size:130px;color:var(--bone);opacity:.85;line-height:1}
.card .bd{padding:12px 14px 14px}
.card .nm{font-weight:800;font-size:19px}
.card .ap{color:var(--blood);font-weight:600;font-size:14px}
.card .rc{color:var(--ash);font-size:13px;margin:2px 0 8px}
.bar{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--ash);margin:3px 0}
.bar i{display:block;height:5px;background:var(--line)}.bar i b{display:block;height:100%;background:var(--blood)}
.badge{position:absolute;top:10px;left:10px;background:var(--blood);color:var(--bone);font-weight:800;padding:2px 10px;font-size:13px}

.dock{position:sticky;bottom:0;background:#000d;backdrop-filter:blur(6px);border-top:1px solid var(--blood);padding:12px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.btn{background:var(--blood);border:0;color:var(--bone);font-weight:800;padding:13px 26px;border-radius:2px}
.btn:disabled{background:var(--line);color:var(--ash);cursor:not-allowed}
.ghost{background:none;border:1px solid var(--ash);color:var(--bone);padding:9px 16px;border-radius:2px}

/* FIGHT */
.ring{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.side{background:var(--panel);border:2px solid var(--line);padding:0;text-align:left;border-radius:2px;overflow:hidden;width:100%}
.side.pick{border-color:var(--gold)}
.side .ph{height:230px}.side .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.side .ph.k{background:linear-gradient(160deg,var(--blood2),var(--sumi));display:flex;align-items:center;justify-content:center}
.side .ph.k span{font-size:110px;line-height:1}
.side .bd{padding:10px 12px}
.odds{color:var(--gold);font-weight:800;font-size:22px}
.vs{align-self:center;font-weight:800;font-size:34px;color:var(--blood)}
.hp{height:10px;background:var(--line);margin-top:8px}.hp b{display:block;height:100%;background:var(--blood);transition:width .5s}
.betbox{margin-top:20px;background:var(--panel);border:1px solid var(--line);padding:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{background:none;border:1px solid var(--gold);color:var(--gold);padding:7px 14px;border-radius:2px;font-weight:600}
input[type=number]{background:var(--sumi);color:var(--bone);border:1px solid var(--ash);padding:11px;width:150px;font:inherit;border-radius:2px}
.logbox{margin-top:16px;min-height:90px;max-height:200px;overflow:auto;border-left:3px solid var(--blood);padding:4px 12px;font-size:14px;color:#d8cfc2}
.result{margin-top:16px;padding:18px;border:2px solid var(--gold);text-align:center}
.result.lose{border-color:var(--blood)}
.result strong{font-size:24px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.pos{color:#7fd48a}.neg{color:#ff6b6b}
@media(max-width:640px){.ring{grid-template-columns:1fr 1fr}.vs{grid-column:1/-1;order:-1;text-align:center;font-size:26px}header.top nav button{padding:8px 7px;font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.btn{clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
input[type=text],input[type=password],input[type=email]{background:var(--sumi);color:var(--bone);border:1px solid var(--ash);padding:13px;font:inherit;border-radius:2px;width:100%}
.chips button.on{background:var(--gold);color:var(--sumi)}
.lg{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lgp{position:relative;background-size:cover;background-position:30% 20%;display:flex;align-items:flex-end;padding:30px}
.lgp::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 35%,var(--sumi)),linear-gradient(0deg,#000c,transparent 60%)}
.lgp p{position:relative;z-index:2;margin:0;font-size:clamp(22px,3.4vw,38px);font-weight:800;max-width:14ch;line-height:1.15}
.lgf{padding:40px 8vw;display:flex;flex-direction:column;justify-content:center;gap:12px}
.lgf .mk{font-size:46px;font-weight:800;color:var(--blood);line-height:1}
.tabs{display:flex;gap:18px;margin:6px 0}.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ash);font-weight:800;padding:6px 0}.tabs button.on{color:var(--bone);border-color:var(--blood)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ash)}
.hero{position:relative;display:grid;grid-template-columns:1fr 1fr;height:440px;overflow:hidden;background:#000;margin:-22px -18px 22px}
.hl,.hr{position:relative;overflow:hidden}.hl{clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}.hr{clip-path:polygon(12% 0,100% 0,100% 100%,0 100%);margin-left:-6%}
.hf{width:100%;height:100%;object-fit:cover;object-position:50% 15%;filter:contrast(1.1) saturate(.9)}
.kj{display:flex;align-items:center;justify-content:center;font-size:200px;background:linear-gradient(160deg,var(--blood2),var(--sumi))}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000 8%,transparent 65%);pointer-events:none}
.hc{position:absolute;z-index:3;left:0;right:0;bottom:22px;text-align:center}
.hev{margin:0;color:var(--blood);font-weight:800}
.hn{font-weight:800;font-size:clamp(34px,9vw,80px);line-height:1}.hn span{color:var(--blood);margin:0 .3em}
.cd{margin:6px 0 12px;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:12px;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blood);padding:14px;margin-bottom:10px;text-align:left}
.row:hover{border-color:var(--blood)}.rn{grid-column:1/-1;color:var(--ash);font-size:13px}.rb{text-align:right}.ro{color:var(--gold);font-weight:800}
@media(max-width:700px){.lg{grid-template-columns:1fr}.lgp{min-height:200px}.hero{height:360px}.kj{font-size:120px}.row{grid-template-columns:1fr auto 1fr;font-size:14px}.row .ro{display:none}}
.rdb{margin-top:16px;text-align:center;font-size:26px;font-weight:800;color:var(--blood)}
.shake{animation:sh .35s}@keyframes sh{0%,100%{transform:none}20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
header.top{flex-wrap:wrap}
.rk{display:grid;grid-template-columns:34px 56px 1fr auto;gap:12px;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);padding:8px 12px;margin-bottom:8px;text-align:left}
.rk:hover{border-color:var(--blood)}.rk .pos2{font-weight:800;font-size:20px;color:var(--ash)}.rk.ch{border-left:4px solid var(--gold)}.rk.ch .pos2{color:var(--gold)}
.rk .th{width:56px;height:56px;overflow:hidden;background:linear-gradient(160deg,var(--blood2),var(--sumi));display:flex;align-items:center;justify-content:center;font-size:30px}.rk .th img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>

<section id="logo" class="view on">
  <div class="sun"></div><div class="fist mincho">拳</div>
  <div class="inner">
    <h1 class="brand mincho">IKFC</h1>
    <p class="tag mincho">Ninguém pergunta o seu nome. Só em quem você aposta.</p>
    <p class="sub">Subsolo · Arena clandestina · 100% simulado</p>
    <button class="cta" id="enter">Entrar na arena</button>
  </div>
  <p class="note">Simulador fictício, inspirado na estética de uma série. Não é um site de apostas real: o saldo é de mentira e nenhum dinheiro é usado.</p>
</section>

<section id="login" class="view"><div class="lg"><div class="lgp" id="lgp"><p class="mincho">Só os melhores chegam ao subsolo.</p></div><div class="lgf" id="lgf"></div></div></section>

<section id="app" class="view">
  <header class="top">
    <button class="mark mincho" data-go="event" aria-label="Início">IKFC</button>
    <nav>
      <button data-go="event" id="n-event">Evento</button>
      <button data-go="catalog" id="n-catalog">Lutadores</button>
      <button data-go="rank" id="n-rank">Ranking</button>
      <button data-go="wallet" id="n-wallet">Carteira</button>
    </nav>
    <div class="wal" id="walTop"></div><button class="ghost" id="out">Sair</button>
  </header>
  <main id="page"></main>
</section>

function sim(a,b,log){
 let ha=100,hb=100;
 for(let r=1;r<=3;r++){
  for(let t=0;t<6;t++){
   const aAtt=Math.random()*(a.spd+b.spd)<a.spd, at=aAtt?a:b, df=aAtt?b:a;
   let d=at.atk*(.5+Math.random())*(100/(100+df.def*1.2))*.2;
   const crit=Math.random()*100<at.cha*.4; if(crit)d*=2;
   if(aAtt)hb-=d;else ha-=d;
   if(log&&(crit||t===0))log.push({r,v:aAtt?"b":"a",crit,txt:crit?`Round ${r}: ${at.n} acerta um golpe devastador!`:`Round ${r}: ${at.n} pressiona e abre a guarda de ${df.n}.`,ha:Math.max(0,ha),hb:Math.max(0,hb)});
   if(ha<=0||hb<=0)return{w:ha<=0?b:a,ko:true,ha:Math.max(0,ha),hb:Math.max(0,hb)};
  }
  if(log)log.push({r,txt:`Fim do round ${r}.`,ha:Math.max(0,ha),hb:Math.max(0,hb)});
 }
 return{w:ha>=hb?a:b,ko:false,ha,hb};
}
function odds(a,b){let w=0;const N=1200;for(let i=0;i<N;i++)if(sim(a,b).w===a)w++;
 const p=Math.min(.95,Math.max(.05,w/N));return{a:Math.max(1.1,+(.92/p).toFixed(2)),b:Math.max(1.1,+(.92/(1-p)).toFixed(2))}}

}
function catalog(){
 const cards=F.filter(f=>flt==="Todos"||f.c===flt).map(f=>{const i=sel.indexOf(f.id);return`<button class="card ${i>-1?"sel":""}" data-pick="${f.id}" aria-pressed="${i>-1}">
 ${i>-1?`<span class="badge">${i?"Canto azul":"Canto vermelho"}</span>`:""}${photo(f)}
 <div class="bd"><div class="nm">${f.n}</div><div class="ap mincho">${f.ap}</div><div class="rc">${f.c} · ${f.rec}</div><div class="rc" style="margin-top:-6px">${ft(f.h)} · ${f.lb} lb</div>${bars(f)}</div></button>`}).join("");
 const ok=sel.length===2;
 return`<h2 class="mincho">Lutadores da noite</h2><p class="lead">Escolha dois lutadores para montar o confronto. Depois defina em quem apostar e quanto.</p>
 <div class="chips">${["Todos","Leve","Médio","Meio-pesado","Pesado"].map(c=>`<button data-flt="${c}" class="${flt===c?"on":""}">${c}</button>`).join("")}</div><div class="grid">${cards}</div>
 <div class="dock"><span>${ok?`${byId(sel[0]).n} x ${byId(sel[1]).n}`:`Selecionados: ${sel.length} de 2`}</span><button class="btn" id="go" ${ok?"":"disabled"}>Ir para a aposta</button></div>`;
}
function fightPage(){
 const a=byId(sel[0]),b=byId(sel[1]);
 if(!fight||fight.key!==a.id+b.id){fight={key:a.id+b.id,o:oddsOf(a,b),done:false,log:[]};pickSide=null}
 const side=(f,k)=>`<button class="side ${pickSide===k?"pick":""}" data-side="${k}" ${busy?"disabled":""}>${photo(f)}<div class="bd"><div class="nm">${f.n}</div><div class="rc">Paga ${"x"+fight.o[k]}</div><div class="odds">x${fight.o[k].toFixed(2)}</div><div class="hp"><b id="hp-${k}" style="width:100%"></b></div></div></button>`;
 return`<h2 class="mincho">Confronto</h2><p class="lead">Toque no lutador em quem quer apostar. Odds calculadas por 1.200 lutas simuladas.</p>
 <div class="ring">${side(a,"a")}<div class="vs mincho">対</div>${side(b,"b")}</div>
 ${tape(a,b)}
 <div class="betbox"><label for="amt"><strong>Valor da aposta</strong> (saldo ${brl(S.wallet)})</label><br>
 <input type="number" id="amt" min="1" max="${S.wallet}" value="100" ${busy?"disabled":""}>
 <div class="chips">${[50,100,250,500].map(v=>`<button data-chip="${v}">${v}</button>`).join("")}<button data-chip="all">Tudo</button></div>
 <p id="msg" style="margin:6px 0;color:var(--ash)">${pickSide?"Apostando em "+byId(sel[pickSide==="a"?0:1]).n+".":"Escolha um lutador."}</p>
 <button class="btn" id="fightBtn" ${busy?"disabled":""}>Apostar e iniciar luta</button> <button class="ghost" data-go="catalog" ${busy?"disabled":""}>Trocar lutadores</button></div>
 <div class="rdb mincho" id="rd">Pronto para lutar</div>
 <div class="logbox" id="log" aria-live="polite">A arena aguarda o primeiro gongo.</div><div id="res"></div>`;
}
function tape(a,b){const r=(l,x,y)=>`<tr><td style="text-align:right">${x}</td><th style="text-align:center;color:var(--ash)">${l}</th><td>${y}</td></tr>`;
 return`<table style="margin-top:18px">${r("Categoria",a.c,b.c)}${r("Cartel",a.rec,b.rec)}${r("Altura",ft(a.h),ft(b.h))}${r("Peso",a.lb+" lb",b.lb+" lb")}${r("Alcance",a.r+" cm",b.r+" cm")}${r("Ataque",a.atk,b.atk)}${r("Defesa",a.def,b.def)}</table>`}
function nextFight(){let d=new Date();d.setHours(22,0,0,0);d.setDate(d.getDate()+(6-d.getDay()+7)%7);if(d<=new Date())d.setDate(d.getDate()+7);return d}
setInterval(()=>{const e=document.getElementById("cd");if(!e)return;let s=Math.max(0,Math.floor((nextFight()-new Date())/1000));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);e.textContent=`Começa em ${d}d ${h}h ${m}min ${s%60}s`},1000);
function eventPage(){
 const face=(f)=>f.img?`<img class="hf" src="${f.img}" alt="${f.n}">`:`<div class="hf kj mincho">${f.k}</div>`;
 const[x,y]=EV[0],a=byId(x),b=byId(y);
 const rows=EV.map(([p,q,t])=>{const A=byId(p),B=byId(q),o=oddsOf(A,B);return`<button class="row" data-fight="${p}-${q}"><span class="rn">${t}</span><span class="nm">${A.n}</span><span class="ro">x${o.a.toFixed(2)}</span><span class="mincho" style="color:var(--blood)">対</span><span class="ro">x${o.b.toFixed(2)}</span><span class="nm rb">${B.n}</span></button>`}).join("");
 return`<section class="hero"><div class="hl">${face(a)}</div><div class="hr">${face(b)}</div><div class="hc"><p class="hev">IKFC 01 · Subsolo</p><div class="hn mincho">${a.n.split(" ").pop()}<span>対</span>${b.n.split(" ").pop()}</div><div class="cd" id="cd">Começa em breve</div><button class="btn" data-fight="${x}-${y}">Apostar no evento principal</button></div></section>
 <h2 class="mincho">Card da noite</h2><p class="lead">Toque em uma luta para ver o comparativo e apostar.</p>${rows}`}
function rankPage(){
 const pw=f=>f.atk+f.def+f.spd;
 const blocks=["Leve","Médio","Meio-pesado","Pesado"].map(c=>{const l=F.filter(f=>f.c===c).sort((a,b)=>pw(b)-pw(a));if(!l.length)return"";
  return`<h2 class="mincho" style="font-size:22px;margin:22px 0 10px">${c}</h2>`+l.map((f,i)=>`<button class="rk ${i?"":"ch"}" data-rk="${f.id}"><span class="pos2">${i?i:"C"}</span><span class="th">${f.img?`<img src="${f.img}" alt="${f.n}">`:`<span class="mincho">${f.k}</span>`}</span><span><strong>${f.n}</strong> <span style="color:var(--ash)">${f.ap}</span><br><span class="rc" style="font-size:13px;color:var(--ash)">${f.rec} · ${ft(f.h)} · ${f.lb} lb</span></span><span class="ro">${pw(f)} pts</span></button>`).join("")}).join("");
 return`<h2 class="mincho">Ranking por categoria</h2><p class="lead">C é o campeão da categoria. A pontuação soma ataque, defesa e agilidade. Toque para escolher o lutador.</p>${blocks}`}
function walletPage(){
 const rows=S.hist.slice().reverse().map(h=>`<tr><td>${h.m}</td><td>${brl(h.bet)}</td><td class="${h.net>=0?"pos":"neg"}">${h.net>=0?"+":"-"}${brl(Math.abs(h.net))}</td></tr>`).join("");
 return`<h2 class="mincho">Carteira digital</h2><p class="lead">Saldo fictício. Nada aqui tem valor real.</p>
 <div class="betbox"><div class="odds" style="font-size:38px">${brl(S.wallet)}</div>
 <div style="color:var(--ash);margin-top:6px">${S.hist.length} apostas · ${S.hist.filter(h=>h.net>0).length} vitórias · resultado total ${(()=>{const n=S.hist.reduce((s,h)=>s+h.net,0);return(n>=0?"+":"-")+brl(Math.abs(n))})()}</div>
 <div class="chips"><button id="dep">Adicionar R$ 500 (simulado)</button><button id="reset">Reiniciar tudo</button></div></div>
 <h2 class="mincho" style="margin-top:26px;font-size:22px">Histórico</h2>
 ${S.hist.length?`<table><tr><th>Luta</th><th>Aposta</th><th>Resultado</th></tr>${rows}</table>`:`<p class="lead">Nenhuma aposta ainda. Escolha dois lutadores e faça a primeira.</p>`}`;
}
function drawLogin(){
 document.getElementById("lgp").style.backgroundImage=`url(${IMG.jin})`;
 document.getElementById("lgf").innerHTML=`<div class="mk mincho">IKFC</div><div class="tabs"><button id="tabIn" class="${regMode?"":"on"}">Entrar</button><button id="tabReg" class="${regMode?"on":""}">Criar conta</button></div>
 <label>Apelido<input type="text" id="lu" autocomplete="off" value="${S.user&&S.user!=="Convidado"?S.user:""}"></label>
 ${regMode?`<label>E-mail<input type="email" id="le" autocomplete="off"></label>`:""}
 <label>Senha<input type="password" id="lp" autocomplete="off"></label>
 ${regMode?`<label class="chk"><input type="checkbox" id="lc"> Entendo que é uma simulação, com saldo fictício.</label>`:""}
 <p id="lm" style="color:#ff6b6b;margin:0;min-height:1.4em" role="alert"></p>
 <button class="btn" id="loginBtn">${regMode?"Criar conta e entrar":"Entrar"}</button><button class="ghost" id="guestBtn">Entrar como convidado</button>
 <p style="font-size:12px;color:var(--ash)">Login simulado: nada é enviado, validado ou guardado fora deste aparelho.</p>`}
function enterApp(n){S.user=n;save();show("app");nav("event")}
async function startFight(){
 const a=byId(sel[0]),b=byId(sel[1]),amt=Math.floor(+document.getElementById("amt").value),msg=document.getElementById("msg");
 if(!pickSide){msg.textContent="Escolha o lutador em quem vai apostar.";return}
 if(!(amt>=1)||amt>S.wallet){msg.textContent="Valor inválido. Digite entre R$ 1 e o seu saldo.";return}
 busy=true;S.wallet-=amt;render();
 document.getElementById("amt").value=amt;
 const log=[],r=sim(a,b,log),L=document.getElementById("log");L.innerHTML="";
 document.getElementById("fightBtn").disabled=true;
 for(const e of log){await new Promise(z=>setTimeout(z,750));const rd=document.getElementById("rd");if(rd)rd.textContent="Round "+e.r;if(e.crit){const s=document.querySelector(`[data-side="${e.v}"]`);if(s){s.classList.add("shake");setTimeout(()=>s.classList.remove("shake"),400)}}L.innerHTML+=`<div>${e.txt}</div>`;L.scrollTop=L.scrollHeight;
  document.getElementById("hp-a").style.width=e.ha+"%";document.getElementById("hp-b").style.width=e.hb+"%"}
 await new Promise(z=>setTimeout(z,600));
 const won=(r.w===a?"a":"b")===pickSide, pay=won?Math.round(amt*fight.o[pickSide]*100)/100:0;
 S.wallet+=pay;S.hist.push({m:`${a.n} x ${b.n}`,bet:amt,net:pay-amt});
 busy=false;
 const how=r.ko?"por nocaute":"por decisão dos juízes";
 render();
 document.getElementById("hp-a").style.width=r.ha+"%";document.getElementById("hp-b").style.width=r.hb+"%";
 document.getElementById("rd").textContent=r.ko?"Nocaute!":"Decisão dos juízes";
 document.getElementById("log").innerHTML=log.map(e=>`<div>${e.txt}</div>`).join("");
 document.getElementById("res").innerHTML=`<div class="result ${won?"":"lose"}"><strong class="mincho">${r.w.n} vence ${how}</strong>${won?`Você ganhou ${brl(pay-amt)} (retorno de ${brl(pay)}).`:`Você perdeu ${brl(amt)}.`}<br><button class="btn" style="margin-top:12px" data-go="catalog">Nova luta</button></div>`;
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.id==="enter"){show("login");return}
 if(t.id==="tabIn"||t.id==="tabReg"){regMode=t.id==="tabReg";drawLogin();return}
 if(t.id==="guestBtn"){enterApp("Convidado");return}
 if(t.id==="out"){S.user=null;show("login");return}
 if(t.id==="loginBtn"){const u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value,m=document.getElementById("lm");
  if(u.length<3){m.textContent="Digite um apelido com 3 letras ou mais.";return}
  if(regMode&&!/^\S+@\S+\.\S+$/.test(document.getElementById("le").value)){m.textContent="Digite um e-mail válido.";return}
  if(p.length<4){m.textContent="A senha precisa ter 4 caracteres ou mais.";return}
  if(regMode&&!document.getElementById("lc").checked){m.textContent="Marque a caixa para continuar.";return}
  enterApp(u);return}
 if(busy)return;
 if(t.dataset.go){nav(t.dataset.go);window.scrollTo(0,0)}
 else if(t.dataset.pick){const i=sel.indexOf(t.dataset.pick);if(i>-1)sel.splice(i,1);else{if(sel.length===2)sel.shift();sel.push(t.dataset.pick)}render()}
 else if(t.dataset.rk){sel=[t.dataset.rk];flt="Todos";nav("catalog");window.scrollTo(0,0)}
 else if(t.dataset.flt){flt=t.dataset.flt;render()}
 else if(t.dataset.fight){sel=t.dataset.fight.split("-");fight=null;nav("fight");window.scrollTo(0,0)}
 else if(t.id==="go"){fight=null;nav("fight");window.scrollTo(0,0)}
 else if(t.dataset.side){pickSide=t.dataset.side;const v=document.getElementById("amt").value;render();document.getElementById("amt").value=v}
 else if(t.dataset.chip){const el=document.getElementById("amt");el.value=t.dataset.chip==="all"?S.wallet:Math.min(+t.dataset.chip,S.wallet)}
 else if(t.id==="fightBtn")startFight();
 else if(t.id==="dep"){S.wallet+=500;render()}
 else if(t.id==="reset"){S={wallet:1000,hist:[]};render()}
});
</script>
</body>
</html>
